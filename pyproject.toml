[project]
name = "dui-ia"
version = "2.0.0.dev0"
description = "Agente inteligente de ciberseguridad: ejecuta herramientas, pide confirmación y explica los resultados en lenguaje simple."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "El-du-ia" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "litellm>=1.103.1,<1.104",
    "python-dotenv>=1.0",
    "platformdirs>=4.2",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    "psutil>=5.9",
    "dnspython>=2.6",
    "httpx>=0.27",
    "scapy>=2.6",
]

[project.scripts]
dui-ia = "dui.__main__:main"

[dependency-groups]
dev = [
    "pyte>=0.8.2",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dui"

[tool.uv]
# Defensa ante ataques a la cadena de suministro: no se resuelven paquetes
# publicados después de esta fecha. Al actualizar dependencias, mover la
# fecha a propósito (y dejar al menos dos semanas de margen).
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:pydantic.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
